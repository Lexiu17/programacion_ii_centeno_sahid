<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar categoría</title>
</head>
<body>
    <main>
        <h1>Eliminar categoría</h1>
        <p>¿Seguro que deseas eliminar «{{ categoria.nombre }}»?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Confirmar eliminación</button>
            <a href="{% url 'categoria_list' %}">Cancelar</a>
        </form>
    </main>
</body>
</html>
